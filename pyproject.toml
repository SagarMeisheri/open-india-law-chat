[project]
name = "open-india-law-chat"
version = "0.1.0"
description = "Legal research chat over the Open India Law corpus (Qdrant + Voyage + Google ADK)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[db]>=2.0",
    "qdrant-client>=1.16",
    "voyageai",
    "python-dotenv",
    "fastembed>=0.9.1",
    "aiosqlite>=0.22.1",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "en-core-web-sm",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
